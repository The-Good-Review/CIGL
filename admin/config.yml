backend:
  name: github
  repo: The-Good-Review/CIGL
  branch: main

media_folder: /uploads
public_folder: /uploads

collections:
  - name: accueil
    label: Accueil
    files:
      - label: Page d'accueil
        name: accueil
        file: "content/accueil.json"
        fields:
          - label: Collaborateurs
            name: collaborateurs
            widget: number

          - label: Nationalités
            name: nationalites
            widget: number

          - label: Formation
            name: "formation"
            widget: number

          - label: Années
            name: annees
            widget: number

  - name: service
    label: Service
    files:
      - label: Page de services
        name: service
        file: "content/service.json"
        fields:
          - label: Vélo
            name: velo
            widget: number

          - label: Accueil
            name: accueil
            widget: number

          - label: Désherbage
            name: desherbage
            widget: number

  - name: accompagnement
    label: Accompagnement
    files:
      - label: Page d'accompagnement
        name: accompagnement
        file: "content/accompagnement.json"
        fields:
          - label: Salaries
            name: salaries
            widget: number

          - label: Cinquantenaire
            name: cinquantenaire
            widget: number

          - label: Heures
            name: heures
            widget: number

          - label: Formations
            name: formations
            widget: number

  - name: emplois
    label: Emplois
    files:
      - label: Offres d'emploi
        name: emplois
        file: "content/emplois.json"
        fields:
          - label: Offre 1
            name: offre1
            widget: object
            fields:
              - label: Poste
                name: poste
                widget: string

              - label: Description
                name: description
                widget: text

              - label: Date
                name: date
                widget: string

              - label: Contrat
                name: contrat
                widget: string

          - label: Offre 2
            name: offre2
            widget: object
            fields:
              - label: Poste
                name: poste
                widget: string

              - label: Description
                name: description
                widget: text

              - label: Date
                name: date
                widget: string

              - label: Contrat
                name: contrat
                widget: string

          - label: Offre 3
            name: offre3
            widget: object
            fields:
              - label: Poste
                name: poste
                widget: string

              - label: Description
                name: description
                widget: text

              - label: Date
                name: date
                widget: string

              - label: Contrat
                name: contrat
                widget: string

  - name: temoignages
    label: Témoignages
    files:
      - label: Témoignages
        name: temoignages
        file: "content/temoignages.json"
        fields:
          - label: Témoignage
            name: temTest
            widget: object
            fields:
              - label: Texte
                name: texte
                widget: text

              - label: Nom
                name: nom
                widget: string

              - label: Métier
                name: metier
                widget: string

              - label: Image
                name: img
                widget: image

  - name: actualites
    label: Actualités
    label_singular: Actualité
    description: Gestion des actualités du CIGL
    extension: json
    format: json
    folder: content/actualites

    create: true

    fields:
      - name: titre
        label: Titre
        widget: string

      - name: sous-titre
        label: Sous-titre
        widget: string

      - name: categorie
        label: Catégorie
        widget: string

      - name: contenu
        label: Contenu
        widget: richtext

      - name: date
        label: Date de publication
        widget: string

      - name: img
        label: Image
        widget: image
